{% set name = "pysmi" %}
{% set version = "2.0.2" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/lextudio/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 9f122c26e0b315baa9f06b2e30c424b21a2c43101949f2834fc2506840a478d5
  patches:
    - 0001-Fix-package-version.patch

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps -vv --no-build-isolation
  entry_points:
    - mibcopy = pysmi.scripts.mibcopy:start
    - mibdump = pysmi.scripts.mibdump:start
  skip: true  # [py<310]

requirements:
  host:
    - pip
    - python
    - flit-core >=3.9.0
  run:
    - python
    - jinja2 >=3.1.3
    - lark >=1.1.9
    - requests >=2.26.0

test:
  source_files:
    - tests
  imports:
    - pysmi
    - pysmi.borrower
    - pysmi.codegen
    - pysmi.lexer
    - pysmi.parser
    - pysmi.reader
    - pysmi.searcher
    - pysmi.writer
  commands:
    - pip check
    - mibcopy --help
    - mibdump --help
    - pytest -v tests
  requires:
    - pip
    - pytest >=6.2.5
    - pysnmp
    - pyasn1

about:
  home: https://pysnmp.com
  license: BSD-2-Clause
  license_family: BSD
  license_file: LICENSE.rst
  summary: SNMP SMI/MIB Parser
  description: 'A pure-Python implementation of SNMP/SMI MIB parsing and conversion library.'
  doc_url: https://docs.lextudio.com/pysmi
  dev_url: https://github.com/lextudio/pysmi

extra:
  recipe-maintainers:
    - nehaljwani